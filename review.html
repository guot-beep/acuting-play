<style>
:root{
  --paper:#F2EAD8;--paper2:#E7DBBE;--ink:#332F28;--ink-soft:#595349;--ink-faint:#676054;
  --sage:#7B8B6F;--sage-deep:#4E5D46;--terra:#B15C3D;--terra-deep:#9D5238;
  --gold:#B08D3E;--seal:#A63B2A;--white:#FDFBF4;
  /* text-safe tier: fills keep their colour, words get a darker one */
  --line:#9A9182;--gold-ink:#755E29;--terra-ink:#944D33;--sage-ink:#596450;
  --ok:#4E7A52;--no:#A63B2A;
  --sh-s:0 2px 6px rgba(51,47,40,.1);--sh:0 5px 16px rgba(51,47,40,.14);--sh-l:0 14px 34px rgba(51,47,40,.22);
  --ease:cubic-bezier(.22,.9,.3,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* `hidden` must win over any author display rule */
[hidden]{display:none !important}
html,body{height:100%;max-width:100%;overflow-x:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:"Songti TC","Noto Serif TC",Georgia,serif;background:#CFC3A8;color:var(--ink);
  display:flex;justify-content:center;overflow:hidden}
#app{position:relative;width:100%;max-width:440px;height:100svh;overflow:hidden;display:flex;flex-direction:column;
  background:radial-gradient(ellipse 130% 50% at 50% -6%,rgba(255,255,255,.5),transparent 62%),
    repeating-linear-gradient(0deg,transparent 0 3px,rgba(120,105,80,.028) 3px 4px),

.seal{position:absolute;right:13px;top:calc(11px + env(safe-area-inset-top));z-index:40;width:29px;height:29px;
  background:var(--seal);color:var(--white);display:flex;align-items:center;justify-content:center;font-size:16px;
  border-radius:4px;transform:rotate(-3deg);opacity:.85;box-shadow:inset 0 0 0 2px rgba(255,255,255,.3);pointer-events:none}
.langBtn{position:absolute;left:13px;top:calc(11px + env(safe-area-inset-top));z-index:40;background:var(--white);

body.nozh .zh{display:none !important}
.chapline{position:relative;z-index:5;text-align:center;font-family:"Courier New",monospace;font-size:10px;

.screen{position:absolute;inset:0;z-index:3;display:none;flex-direction:column;

/* mentor row */
.mrow{display:flex;gap:13px;align-items:center;background:var(--white);border:1.5px solid rgba(51,47,40,.11);

.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sage),var(--gold));width:0;transition:width .4s var(--ease)}

/* order + match chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--white);border:1.5px solid rgba(51,47,40,.12);border-radius:12px;padding:10px 13px;

body.nozh .chip .c{display:none}
.chip.done{border-color:var(--ok);background:#F1F6EE;opacity:.55;pointer-events:none}
.chip.sel{border-color:var(--gold-ink);background:#FBF6E8}

.mgrid{display:flex;gap:9px}
.mcol{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
.mcol h4{font-family:"Courier New",monospace;font-size:10.5px;letter-spacing:.2em;color:var(--ink-faint);

.fb .hd{font-family:"Courier New",monospace;font-size:10px;letter-spacing:.22em;margin-bottom:5px;color:var(--ok)}

.btn{width:100%;min-height:52px;border:none;border-radius:14px;cursor:pointer;font-family:inherit;font-size:16.5px;

/* result */

.stars{font-size:38px;color:var(--gold-ink);letter-spacing:.14em}

.gain .rar{font-family:"Courier New",monospace;font-size:10px;letter-spacing:.24em;color:var(--gold-ink)}
.gain h3{font-size:18px;margin:3px 0 5px}
.gain p{font-size:12.5px;color:var(--ink-soft);line-height:1.7}
.missed{background:rgba(255,255,255,.6);border:1px dashed rgba(51,47,40,.22);border-radius:12px;padding:11px 13px;

.missed h4{font-family:"Courier New",monospace;font-size:10px;letter-spacing:.22em;color:var(--terra-ink);margin-bottom:6px}

<script>
/* ══════════════════════════════════════════════════════════════
   Review 溫故 — the second meeting

   The queue lives in state.js. This page's only job is to turn a due
   key back into the question it came from, ask it again, and report
   the answer to AG.review.mark().

   Keys look like  c:11:dx1 | p:zangfu:1a2b3c | h:LI4:1a2b3c | s:wuxing:1a2b3c
   The source file is loaded ONLY if something from it is actually due —
   a quiet day loads nothing at all.

   Some items cannot honestly be replayed as a single question: a
   three-point prescription, a sequencing drill, a bucket sort. Those are
   not faked into multiple choice; they are listed as a link back to
   where they live. Pretending would teach the wrong thing.
   ══════════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const zh = t => t ? '<span class="zh">' + t + "</span>" : "";
AG.applyLang && AG.applyLang();
AG.bindLangButton && AG.bindLangButton($("langBtn"));

const CHIDX = window.AG_CHAPTER_INDEX || {};
const PRIDX = window.AG_PRACTICE_INDEX || {};

/* ── load a data file once, on demand ── */
const loaded = {};
function need(src){
  if (loaded[src]) return loaded[src];
  loaded[src] = new Promise(function(resolve){
    const s = document.createElement("script");
    s.src = src;
    s.onload = () => resolve(true);
    s.onerror = () => resolve(false);      // a missing file must not hang the page
    document.head.appendChild(s);
  });
  return loaded[src];
}

/* ── rebuild one due key into a playable question, or null ── */
const CH_STAGE = { look:"look", pulse:"pulse", tech:"tech" };

async function rebuild(entry){
  const parts = entry.key.split(":");
  const src = parts[0], owner = parts[1], slot = parts.slice(2).join(":");

  if (src === "c"){
    const id = String(owner).replace(/[^0-9]/g, "");
    if (!/^\d{2}$/.test(id)) return null;
    await need("data/chapters/" + id + ".js");
    const CH = (window.AG_CHAPTERS || {})[id];
    if (!CH) return null;
    let opts = null, prompt = "";
    if (CH_STAGE[slot] && CH[CH_STAGE[slot]]){
      opts = CH[CH_STAGE[slot]];
      prompt = slot === "look" ? "What does the tongue show?"
             : slot === "pulse" ? "What is the pulse?"
             : "Which technique?";
    } else if (/^dx\d+$/.test(slot)){
      const n = +slot.slice(2);
      const step = (CH.dx || [])[n];
      if (!step) return null;
      opts = step.opts;
      prompt = String(step.ask || "").replace(/<small[\s\S]*?<\/small>/g, "");
    } else if (slot === "safety" && CH.safety){
      opts = CH.safety.opts;
      prompt = (CH.safety.ask && CH.safety.ask.en) || "Is this safe to keep evaluating here?";
    }
    if (!opts || !opts.length) return null;
    return { key: entry.key, q: prompt, qZh: "",
             src: entry.lbl || ("Chapter " + id), sub: entry.sub || (CH.pattern || ""),
             opts: opts.map(o => ({ t:o.t, c:o.c, ok:!!o.ok, note:o.note })) };
  }

  if (src === "p"){
    await need("data/practice/" + owner + ".js");
    const D = (window.AG_PRACTICE || {})[owner];
    if (!D) return null;
    const it = (D.items || []).filter(x => x.k === "mc" && AG.review.slot(x.q) === slot)[0];
    if (!it) return null;
    return { key: entry.key, q: it.q, qZh: it.qZh || "",
             src: entry.lbl || ("Practice · " + D.title), sub: entry.sub || D.titleZh || "",
             opts: it.opts.map(o => ({ t:o.t, c:o.c, ok:!!o.ok, note:o.note })) };
  }

  if (src === "h"){
    await need("data/pointstory.js");
    const st = (window.AG_POINTSTORY || []).filter(x => x.id === owner)[0];
    if (!st) return null;
    const q = (st.qs || []).filter(x => AG.review.slot(x.q) === slot)[0];
    if (!q) return null;
    return { key: entry.key, q: q.q, qZh: q.cq || "",
             src: entry.lbl || ("Point Hall · " + owner), sub: entry.sub || "",
             opts: q.opts.map(o => ({ t:o.t, c:o.c, ok:!!o.ok, note:o.note })) };
  }

  return null;   // sorting sets and multi-select prescriptions link out instead
}

/* ── build the session ── */
let QUEUE = [], LINKS = [], idx = 0, right = 0;

async function boot(){
  const due = AG.review.due(24);
  const built = [];
  for (const e of due){
    let q = null;
    try { q = await rebuild(e); } catch (err) { q = null; }
    if (q) built.push(q); else LINKS.push(e);
  }
  QUEUE = built;

  const total = due.length;
  $("dueN").textContent = total;
  $("dueLine").innerHTML = total === 0
    ? 'nothing waiting today' + zh("今日無待溫之題")
    : (total === 1 ? "one question is due" : total + " questions are due") + zh("今日待溫 " + total + " 題");

  $("how").innerHTML = total === 0
    ? nextLine()
    : "<b>These are questions you have met before.</b> Answer them again — the ones you miss come back tomorrow, "
      + "the ones you get right move further away." + zh("此皆曾遇之題。再答一次：錯者明日復見，對者則漸行漸遠。");

  $("go").hidden = QUEUE.length === 0;
  if (QUEUE.length) $("go").innerHTML = "Begin ▸<small>" + QUEUE.length + " question" + (QUEUE.length>1?"s":"") + " · 開始溫故</small>";

  paintLinks();
}

function nextLine(){
  const n = AG.review.nextDay();
  if (n === null) return "Nothing is scheduled yet. Play a chapter, a practice deck or the Point Hall and the questions you meet will start appearing here."
    + zh("尚無排程。走一章故事、練一副牌，或入點穴堂，所遇之題自會列於此。");
  const days = n - AG.review.dayNumber();
  return "Nothing is due today. The next question comes back "
    + (days <= 1 ? "tomorrow" : "in " + days + " days") + "."
    + zh("今日無題。下一題於" + (days <= 1 ? "明日" : days + "日後") + "復見。");
}

function paintLinks(){
  if (!LINKS.length){ $("linkouts").innerHTML = ""; return; }
  $("linkouts").innerHTML =
    '<div class="rvsrc">Go back to these</div>'
    + LINKS.map(e => '<a class="rvcard" href="' + (e.href || "index.html") + '">'
        + "<b>" + (e.lbl || e.key) + "</b>"
        + (e.sub ? "<span>" + e.sub + "</span>" : "") + "</a>").join("");
}

/* ── play ── */
function show(id){
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("on"));
  $(id).classList.add("on");
  $(id).scrollTop = 0;
}

function render(){
  const it = QUEUE[idx];
  $("rnd").textContent = (idx + 1) + " / " + QUEUE.length;
  $("sc").textContent = right;
  $("barfill").style.width = (idx / QUEUE.length * 100) + "%";
  $("src").innerHTML = it.src + (it.sub ? " · " + it.sub : "");
  $("q").innerHTML = it.q + zh(it.qZh);
  $("fb").hidden = true;
  $("next").hidden = true;

  let locked = false;
  const shuffled = it.opts.map((o, i) => ({ o:o, i:i }));
  for (let i = shuffled.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = shuffled[i]; shuffled[i] = shuffled[j]; shuffled[j] = t;
  }
  $("opts").innerHTML = "";
  shuffled.forEach(rec => {
    const o = rec.o;
    const el = document.createElement("button");
    el.className = "opt"; el.type = "button";
    el.innerHTML = o.t + (o.c ? '<span class="c">' + o.c + "</span>" : "");
    el.onclick = () => {
      if (locked) return;
      locked = true;
      if (o.ok) right++;
      try { AG.review.mark(it.key, !!o.ok); } catch (e) {}
      $("opts").querySelectorAll(".opt").forEach(x => { x.disabled = true; x.classList.add("dim"); });
      el.classList.remove("dim");
      el.classList.add(o.ok ? "right" : "wrong");
      if (!o.ok){
        const correct = it.opts.filter(x => x.ok)[0];
        [...$("opts").querySelectorAll(".opt")].forEach(x => {
          if (correct && x.textContent.indexOf(correct.t) === 0){ x.classList.remove("dim"); x.classList.add("right"); }
        });
        $("fb").className = "fb warn";
        $("fb").innerHTML = '<div class="hd">NOT QUITE 再想想</div>' + (o.note || "")
          + (correct ? "<br><br><b>The answer:</b> " + correct.t + "<br>" + (correct.note || "") : "");
      } else {
        $("fb").className = "fb";
        $("fb").innerHTML = '<div class="hd">CORRECT 正確</div>' + (o.note || "");
      }
      $("fb").hidden = false;
      $("sc").textContent = right;
      $("next").textContent = (idx + 1 >= QUEUE.length) ? "See result ▸" : "Next ▸";
      $("next").hidden = false;
    };
    $("opts").appendChild(el);
  });
}

$("next").onclick = () => { idx++; if (idx >= QUEUE.length) finish(); else render(); };

function finish(){
  const c = AG.review.counts();
  $("doneN").textContent = right + " / " + QUEUE.length;
  $("doneLine").innerHTML = "answered correctly" + zh("答對之數");
  $("doneNote").innerHTML =
    (right === QUEUE.length
      ? "<b>All of them.</b> Those questions move further away now."
      : "<b>The ones you missed come back tomorrow.</b> That is the whole point of the queue — you meet a thing again on the day you were about to forget it.")
    + zh(right === QUEUE.length ? "全對。此數題自此漸疏。" : "所錯者明日復見。此即溫故之意：將忘之時，恰與之重逢。")
    + "<br><br>Tracked: " + c.tracked + " · still shaky: " + c.shaky + " · retired: " + c.retired
    + zh("已錄 " + c.tracked + " 題 · 未穩 " + c.shaky + " 題 · 已熟 " + c.retired + " 題");
  $("again").hidden = AG.review.counts().due === 0;
  show("s3");
}

$("go").onclick = () => { idx = 0; right = 0; show("s2"); render(); };
$("again").onclick = () => location.reload();
$("back1").onclick = $("back3").onclick = () => { location.href = "index.html"; };

boot();
</script>
</body>
</html>
